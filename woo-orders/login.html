<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orders Login</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f5f7; color: #222; font-size: 14px; }
  .login { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e3e5e8; border-radius: 10px; padding: 32px 28px; box-shadow: 0 4px 20px rgba(0,0,0,.05); }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: #1f6feb; color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  .sub { text-align: center; color: #777; margin: 0 0 20px; }
  label { display: block; margin: 14px 0 5px; font-weight: 600; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 14px; font-family: inherit; }
  input:focus { outline: 2px solid #1f6feb33; border-color: #1f6feb; }
  .pw { position: relative; }
  .pw input { padding-right: 60px; }
  .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: #1f6feb; cursor: pointer; font-size: 12px; padding: 6px; }
  .btn { width: 100%; margin-top: 20px; padding: 11px; border-radius: 6px; border: 0; background: #1f6feb; color: #fff; font-size: 15px; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .err { background: #ffebe9; color: #a40e26; padding: 10px; border-radius: 6px; margin-bottom: 4px; }
  .hidden { display: none; }
</style>
</head>
<body>
<form id="loginForm" class="login">
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
  </div>
  <h1>Orders Dashboard</h1>
  <p class="sub">Login karein</p>
  <div id="err" class="err hidden"></div>
  <label for="user">Username</label>
  <input id="user" type="text" required autofocus autocomplete="username">
  <label for="pass">Password</label>
  <div class="pw">
    <input id="pass" type="password" required autocomplete="current-password">
    <button type="button" id="toggle">Show</button>
  </div>
  <button class="btn" type="submit" id="btn">Login</button>
</form>
<script>
const $ = id => document.getElementById(id);
// Pehle se login hai to seedha dashboard
fetch('/api/orders?check=1').then(r => { if (r.ok) location.replace('/'); }).catch(() => {});

$('toggle').onclick = () => {
  const p = $('pass'); const show = p.type === 'password';
  p.type = show ? 'text' : 'password'; $('toggle').textContent = show ? 'Hide' : 'Show';
};

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('btn').disabled = true; $('btn').textContent = 'Please wait…';
  $('err').classList.add('hidden');
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: $('user').value.trim(), pass: $('pass').value }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Login failed');
    location.replace('/');
  } catch (err) {
    $('err').textContent = err.message;
    $('err').classList.remove('hidden');
    $('btn').disabled = false; $('btn').textContent = 'Login';
  }
});
</script>
</body>
</html>
