<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#C64948">
<title>Login · Poeller Technologies Orders</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Poeller Technologies branding (poellertechnologies.com) */
  :root { --red: #C64948; --red-dark: #A93B3A; --gray: #9F9B9B; --gray-dark: #54595F; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px;
         font-family: "Roboto", -apple-system, "Segoe UI", Arial, sans-serif; color: #1E1E1E; font-size: 14px;
         background: linear-gradient(180deg, var(--red) 0, var(--red) 300px, #F4F3F3 300px); }
  .login { width: 100%; max-width: 400px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
  .head { background: #fff; padding: 28px 28px 8px; text-align: center; border-bottom: 1px solid #eee; }
  .head img { width: 230px; max-width: 80%; height: auto; display: block; margin: 0 auto 14px; }
  .body { padding: 22px 28px 28px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  .sub { color: #777; margin: 0 0 14px; }
  label { display: block; margin: 14px 0 5px; font-weight: 500; }
  input { width: 100%; padding: 11px 12px; border: 1px solid #cfcaca; border-radius: 8px; font-size: 14px; font-family: inherit; }
  input:focus { outline: 2px solid #c6494833; border-color: var(--red); }
  .pw { position: relative; }
  .pw input { padding-right: 60px; }
  .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--red); font-weight: 500; cursor: pointer; font-size: 12px; padding: 6px; font-family: inherit; }
  .btn { width: 100%; margin-top: 22px; padding: 12px; border-radius: 8px; border: 0; background: var(--red); color: #fff; font-size: 15px; font-weight: 500; font-family: inherit; cursor: pointer; transition: background .15s; }
  .btn:hover { background: var(--red-dark); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .err { background: #fdecec; color: #9b2c2b; border: 1px solid #f3c9c9; padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; }
  .hidden { display: none; }
  footer { margin-top: 20px; color: #888; font-size: 12px; text-align: center; }
  footer a { color: var(--red); text-decoration: none; }
</style>
</head>
<body>
<form id="loginForm" class="login">
  <div class="head">
    <img src="/logo.png" alt="Poeller Technologies Inc">
  </div>
  <div class="body">
  <h1>Orders Dashboard</h1>
  <p class="sub">Apna username aur password daal kar login karein</p>
  <div id="err" class="err hidden"></div>
  <label for="user">Username</label>
  <input id="user" type="text" required autofocus autocomplete="username">
  <label for="pass">Password</label>
  <div class="pw">
    <input id="pass" type="password" required autocomplete="current-password">
    <button type="button" id="toggle">Show</button>
  </div>
  <button class="btn" type="submit" id="btn">Login</button>
  </div>
</form>
<footer>© Poeller Technologies Inc · <a href="https://poellertechnologies.com/" target="_blank" rel="noopener">poellertechnologies.com</a></footer>
<script>
const $ = id => document.getElementById(id);
// Pehle se login hai to seedha dashboard
fetch('/api/orders?check=1').then(r => { if (r.ok) location.replace('/'); }).catch(() => {});

$('toggle').onclick = () => {
  const p = $('pass'); const show = p.type === 'password';
  p.type = show ? 'text' : 'password'; $('toggle').textContent = show ? 'Hide' : 'Show';
};

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('btn').disabled = true; $('btn').textContent = 'Please wait…';
  $('err').classList.add('hidden');
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: $('user').value.trim(), pass: $('pass').value }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Login failed');
    location.replace('/');
  } catch (err) {
    $('err').textContent = err.message;
    $('err').classList.remove('hidden');
    $('btn').disabled = false; $('btn').textContent = 'Login';
  }
});
</script>
</body>
</html>
